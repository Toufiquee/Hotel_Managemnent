<div class="landing">

  <!-- Hero Section -->
  <div class="hero">
    <div class="hero-content">
      <h1>Experience Luxury Dining</h1>
      <p>Delicious food, premium ambiance, unforgettable taste</p>
      <button class="cta-btn" (click)="scrollTo('reservation')">
        Book a Table
      </button>
    </div>
  </div>

</div>

<!-- MENU / PRODUCT SLIDER -->
<section id="menu" class="section product-slider-section">
  <h2>🍔 Our Menu</h2>
  <p>Explore our delicious dishes</p>
  
  <div class="slider-container">
    <button class="slider-btn prev" (click)="prevSlide()">&#10094;</button>
    
    <div class="slider-wrapper">
      <div class="products-track" [style.transform]="'translateX(-' + (currentSlide * (100 / itemsPerView)) + '%)'">
        @for (product of featuredProducts; track product.id) {
          <div class="slider-product">
            <div class="product-image">
              <img [src]="product.image" [alt]="product.name" />
            </div>
            <div class="product-details">
              <span class="category">{{ product.category }}</span>
              <h3>{{ product.name }}</h3>
              <span class="price">\${{ product.price.toFixed(2) }}</span>
            </div>
          </div>
        }
      </div>
    </div>
    
    <button class="slider-btn next" (click)="nextSlide()">&#10095;</button>
  </div>
  
  <a routerLink="/shop" class="view-all-btn">View Full Menu</a>
</section>

<!-- RESERVATION -->
<section id="reservation" class="section">
  <app-reservation></app-reservation>
</section>

<!-- REVIEWS -->
<section id="reviews" class="section">
  <app-reviews></app-reviews>
</section>

<!-- ABOUT -->
<section id="about" class="section">
  <app-about-us></app-about-us>
</section>
